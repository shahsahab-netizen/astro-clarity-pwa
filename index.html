    const PLANET_METADATA = [
      { id: "Sun", abbrev: "Su", name: "Sun", ur: "شمس", symbol: "☉", color: "#d97706" },
      { id: "Moon", abbrev: "Mo", name: "Moon", ur: "قمر", symbol: "☽", color: "#475569" },

      { id: "Mars", abbrev: "Ma", name: "Mars", ur: "مریخ", symbol: "♂", color: "#dc2626" },
      { id: "Jupiter", abbrev: "Ju", name: "Jupiter", ur: "مشتری", symbol: "♃", color: "#7c3aed" },

    /* 2. HIGH PRECISION ASTRONOMICAL CALCULATIONS */
    function computeChart(utcDate, lat, lng) {
      const timeMs = utcDate.getTime();
      const jd = (timeMs / 86400000.0) + 2440587.5;
      const d = jd - 2451545.0;
      const T = d / 36525.0;

      // Obliquity of the Ecliptic
      const epsDeg = 23.4392911 - 0.0130042 * T;
      const epsRad = epsDeg * Math.PI / 180;
      const latRad = lat * Math.PI / 180;

      // Greenwich Mean Sidereal Time (GMST) & RAMC
      let gmst = 280.46061837 + 360.98564736629 * d + 0.000387933 * T * T;
      gmst = ((gmst % 360) + 360) % 360;
      const ramc = ((gmst + lng) % 360 + 360) % 360;
      const ramcRad = ramc * Math.PI / 180;

      // Exact Midheaven (MC)
      let mcLon = Math.atan2(Math.sin(ramcRad), Math.cos(ramcRad) * Math.cos(epsRad)) * (180 / Math.PI);
      mcLon = ((mcLon % 360) + 360) % 360;

      // Exact Ascendant (ASC)
      const ascY = Math.cos(ramcRad);
      const ascX = -(Math.sin(epsRad) * Math.tan(latRad) + Math.cos(epsRad) * Math.sin(ramcRad));
      let ascLon = Math.atan2(ascY, ascX) * (180 / Math.PI);
      ascLon = ((ascLon % 360) + 360) % 360;

      // Placidus Houses
      const houseCusps = computePlacidus(ramc, ascLon, mcLon, lat, epsDeg);

      // Planetary Longitudes
      const planets = [];
      const isAstronomy = typeof Astronomy !== "undefined";

      PLANET_METADATA.forEach(meta => {
        let lon = 0;
        let isRetro = false;

        if (meta.id === "Rahu" || meta.id === "Ketu") {
          const omega = ((125.04452 - 1934.136261 * T) % 360 + 360) % 360;
          lon = meta.id === "Rahu" ? omega : (omega + 180) % 360;
          isRetro = true;
        } else if (isAstronomy) {
          try {
            lon = Astronomy.EclipticLongitude(meta.id, utcDate);
            const nextDate = new Date(utcDate.getTime() + 6 * 3600000);
            const nextLon = Astronomy.EclipticLongitude(meta.id, nextDate);
            let diff = nextLon - lon;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            if (diff < 0) isRetro = true;
          } catch(e) {
            lon = getAnalyticalLongitude(meta.id, d, T);
          }
        } else {
          lon = getAnalyticalLongitude(meta.id, d, T);
        }

        const signIndex = Math.floor(lon / 30) % 12;
        const degInSign = lon % 30;
        const deg = Math.floor(degInSign);
        const min = Math.floor((degInSign - deg) * 60);

        // D9 Navamsha Pada
        const totalPadas = Math.floor(lon / 3.33333333);
        const d9SignIndex = totalPadas % 12;
        const d9Deg = Math.floor((lon % 3.33333333) * 9);

        // Placidus House
        const houseNum = getHouse(lon, houseCusps);

        planets.push({
          ...meta,
          longitude: lon,
          signIndex,
          signName: ZODIAC_SIGNS[signIndex].name,
          signUr: ZODIAC_SIGNS[signIndex].ur,
          signSymbol: ZODIAC_SIGNS[signIndex].symbol,
          deg,
          min,
          formatted: `${deg}°${min < 10 ? '0' + min : min}'`,
          isRetro,
          d9SignIndex,
          d9SignName: ZODIAC_SIGNS[d9SignIndex].name,
          d9Deg,
          houseNum
        });
      });

      const ascSignIdx = Math.floor(ascLon / 30) % 12;
      const ascDegInSign = ascLon % 30;
      const ascDeg = Math.floor(ascDegInSign);
      const ascMin = Math.floor((ascDegInSign - ascDeg) * 60);

      const mcSignIdx = Math.floor(mcLon / 30) % 12;
      const mcDegInSign = mcLon % 30;

      return {
        ascendant: {
          longitude: ascLon,
          signIndex: ascSignIdx,
          signName: ZODIAC_SIGNS[ascSignIdx].name,
          signUr: ZODIAC_SIGNS[ascSignIdx].ur,
          formatted: `${ascDeg}°${ascMin < 10 ? '0' + ascMin : ascMin}'`,
          deg: ascDeg,
          min: ascMin
        },
        midheaven: {
          longitude: mcLon,
          signIndex: mcSignIdx,
          signName: ZODIAC_SIGNS[mcSignIdx].name,
          formatted: `${Math.floor(mcDegInSign)}°${Math.floor((mcDegInSign % 1) * 60)}'`
        },
        houseCusps,
        planets
      };
    }

    function computePlacidus(ramc, asc, mc, lat, eps) {
      const cusps = new Array(13).fill(0);
      cusps[1] = asc;
      cusps[10] = mc;
      cusps[7] = (asc + 180) % 360;
      cusps[4] = (mc + 180) % 360;

      const calcCusp = (rOffset, factor, isAbove) => {
        const phi = lat * Math.PI / 180;
        const e = eps * Math.PI / 180;
        let ra = (ramc + rOffset) * Math.PI / 180;
        for (let i = 0; i < 8; i++) {
          const sinD = Math.sin(e) * Math.sin(ra);
          const tanD = sinD / Math.sqrt(Math.max(0.0001, 1 - sinD * sinD));
          const ad = Math.asin(Math.max(-0.999, Math.min(0.999, Math.tan(phi) * tanD)));
          const target = (ramc * Math.PI / 180) + (isAbove ? 1 : -1) * (factor * (Math.PI / 2 + ad));
          ra = (ra + target) / 2;
        }
        let l = Math.atan2(Math.sin(ra) / Math.cos(e), Math.cos(ra)) * (180 / Math.PI);
        return ((l % 360) + 360) % 360;
      };

      cusps[11] = calcCusp(30, 1/3, true);
      cusps[12] = calcCusp(60, 2/3, true);
      cusps[2] = calcCusp(120, 2/3, false);
      cusps[3] = calcCusp(150, 1/3, false);

      cusps[5] = (cusps[11] + 180) % 360;
      cusps[6] = (cusps[12] + 180) % 360;
      cusps[8] = (cusps[2] + 180) % 360;
      cusps[9] = (cusps[3] + 180) % 360;

      return cusps;
    }

    function getHouse(lon, cusps) {
      for (let h = 1; h <= 12; h++) {
        const nextH = h === 12 ? 1 : h + 1;
        let start = cusps[h];
        let end = cusps[nextH];
        if (start < end) {
          if (lon >= start && lon < end) return h;
        } else {
          if (lon >= start || lon < end) return h;
        }
      }
      return 1;
    }

    function getAnalyticalLongitude(id, d, T) {
      const meanL = {
        Sun: 280.466 + 0.9856474 * d,
        Moon: 218.316 + 13.176396 * d,
        Mercury: 252.25 + 4.092334 * d,
        Venus: 181.98 + 1.602130 * d,
        Mars: 355.43 + 0.524033 * d,
        Jupiter: 34.35 + 0.083085 * d,
        Saturn: 50.08 + 0.033444 * d,
        Uranus: 314.05 + 0.011728 * d,
        Neptune: 304.35 + 0.005981 * d,
        Pluto: 238.96 + 0.00397 * d
      };
      return ((meanL[id] || 0) % 360 + 360) % 360;
    }

    /* 3. MAIN REACT APP */
    function App() {
      const [activeTab, setActiveTab] = useState("natal");
      const [chartView, setChartView] = useState("D1");

      const [country, setCountry] = useState("Pakistan");
      const [province, setProvince] = useState("Sindh");
      const [city, setCity] = useState("Karachi");
      const [lat, setLat] = useState(24.8607);
      const [lng, setLng] = useState(67.0011);
      const [tz, setTz] = useState(5.0);

      // Date & Time States (Explicit Dropdowns)
      const [day, setDay] = useState(22);
      const [month, setMonth] = useState(1);
      const [year, setYear] = useState(1975);
      const [hour, setHour] = useState(12);
      const [minute, setMinute] = useState(42);
      const [ampm, setAmpm] = useState("PM");

      const [chartData, setChartData] = useState(null);
      const [transits, setTransits] = useState([]);
      const [horaryQuestion, setHoraryQuestion] = useState("");
      const [horaryResult, setHoraryResult] = useState(null);

      // Auto-compute Real-Time Current Transits immediately
      useEffect(() => {
        const now = new Date();
        const t = computeChart(now, lat, lng);
        setTransits(t.planets);
      }, [lat, lng]);

      // City Selection Handler
      const handleCityChange = (cityName) => {
        setCity(cityName);
        const list = CITIES_DB[country]?.[province] || [];
        const found = list.find(c => c.name === cityName);
        if (found) {
          setLat(found.lat);
          setLng(found.lng);
          setTz(found.tz);
        }
      };

      // 1-Click Load User's exact birth chart
      const loadUserExactProfile = () => {
        setCountry("Pakistan");
        setProvince("Sindh");
        setCity("Karachi");
        setLat(24.8607);
        setLng(67.0011);
        setTz(5.0);
        setDay(22);
        setMonth(1);
        setYear(1975);
        setHour(12);
        setMinute(42);
        setAmpm("PM");

        // Immediately compute
        let h = 12;
        if (ampm === "PM" && h < 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;
        const utc = new Date(Date.UTC(1975, 0, 22, 12 - 5, 42));
        const res = computeChart(utc, 24.8607, 67.0011);
        setChartData(res);
      };

      const handleGenerate = (e) => {

        let h = parseInt(hour);
        if (ampm === "PM" && h < 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;

        const utc = new Date(Date.UTC(year, month - 1, day, h - tz, minute));

        setChartData(res);

      return (

            <div className="flex bg-amber-50 p-1 rounded-xl border border-amber-200 no-print text-xs font-semibold">

            </div>
          </header>

          {activeTab === "natal" && (
            <div className="mt-6 space-y-6">

                    <div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3">

                    <div>

                        <select value={hour} onChange={e => setHour(Number(e.target.value))} className="w-1/3 p-2 bg-slate-50 border rounded-lg font-bold text-center">

                        <select value={minute} onChange={e => setMinute(Number(e.target.value))} className="w-1/3 p-2 bg-slate-50 border rounded-lg font-bold text-center">

              </div>

              {/* RENDERED CHART AREA */}
              {chartData && (
                <div className="space-y-6">
                  {/* View Controls & Zoom */}
                  <div className="flex justify-between items-center bg-white p-3 rounded-xl border border-amber-200">
                    <div className="flex gap-2 text-xs font-bold">
                      <button
                        onClick={() => setChartView("D1")}
                        className={`px-3 py-1.5 rounded-lg ${chartView === "D1" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-700"}`}
                      >
                        D1 (Placidus)
                      </button>
                      <button
                        onClick={() => setChartView("D9")}
                        className={`px-3 py-1.5 rounded-lg ${chartView === "D9" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-700"}`}
                      >
                        D9 (Navamsha)
                      </button>
                    </div>

                    <div className="flex items-center gap-2 text-xs no-print">
                      <span className="text-slate-500 font-semibold">Zoom:</span>
                      <button onClick={() => setZoomLevel(z => Math.max(0.8, z - 0.15))} className="px-2.5 py-1 bg-slate-100 border rounded font-bold">-</button>
                      <span className="font-mono">{Math.round(zoomLevel * 100)}%</span>
                      <button onClick={() => setZoomLevel(z => Math.min(1.8, z + 0.15))} className="px-2.5 py-1 bg-slate-100 border rounded font-bold">+</button>
                    </div>
                  </div>

                  {/* Summary Badges */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                    <div className="bg-amber-50 border-2 border-amber-400 p-3 rounded-xl shadow-sm">
                      <div className="text-xs text-amber-800 font-semibold">طالع (Ascendant / 1st House)</div>
                      <div className="text-xl font-bold text-amber-950">
                        {chartData.ascendant.signName} ({chartData.ascendant.signUr}) {chartData.ascendant.formatted}
                      </div>
                    </div>
                    <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl">
                      <div className="text-xs text-slate-600 font-semibold">وسط السماء (MC / 10th House)</div>
                      <div className="text-lg font-bold text-slate-900">
                        {chartData.midheaven.signName} {chartData.midheaven.formatted}
                      </div>
                    </div>
                    <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl">
                      <div className="text-xs text-slate-600 font-semibold">قمر (Moon Sign)</div>
                      <div className="text-lg font-bold text-slate-900">
                        {chartData.planets.find(p => p.id === "Moon")?.signName} {chartData.planets.find(p => p.id === "Moon")?.formatted}
                      </div>
                    </div>
                    <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl">
                      <div className="text-xs text-slate-600 font-semibold">شمس (Sun Sign)</div>
                      <div className="text-lg font-bold text-slate-900">
                        {chartData.planets.find(p => p.id === "Sun")?.signName} {chartData.planets.find(p => p.id === "Sun")?.formatted}
                      </div>
                    </div>
                  </div>

                  {/* TRUE ASTROLOGICAL DUAL WHEEL (SVG) */}
                  <div className="bg-white p-6 rounded-2xl border border-amber-200 flex flex-col items-center overflow-hidden">
                    <div className="text-xs text-slate-500 font-medium mb-3 flex items-center gap-4">
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-slate-800"></span> اندرونی دائرہ: پیدائشی سیارے (Natal)</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-amber-500"></span> بیرونی دائرہ: موجودہ لائیو گوچر (Current Transits)</span>
                    </div>

                    <div style={{ transform: `scale(${zoomLevel})`, transformOrigin: "center center", transition: "transform 0.2s" }}>
                      <TrueAstroWheel
                        natal={chartData.planets}
                        transits={transits}
                        ascendant={chartData.ascendant}
                        mc={chartData.midheaven}
                        cusps={chartData.houseCusps}
                        view={chartView}
                      />
                    </div>
                  </div>

                  {/* Tables: Natal vs Current Transits */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Natal Planets */}
                    <div className="bg-white p-4 rounded-xl border border-amber-200">
                      <h3 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2">پیدائشی سیارے (22 Jan 1975, Karachi)</h3>
                      <table className="w-full text-xs text-left">
                        <thead>
                          <tr className="text-slate-400 border-b pb-1">
                            <th>Planet</th>
                            <th>Sign</th>
                            <th>Degree</th>
                            <th>House</th>
                            <th>Motion</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                          {chartData.planets.map(p => (
                            <tr key={p.id} className="hover:bg-amber-50/50">
                              <td className="py-2 font-bold flex items-center gap-1" style={{ color: p.color }}>
                                <span>{p.symbol}</span>
                                <span>{p.abbrev}</span>
                              </td>
                              <td>{p.signName} ({p.signUr})</td>
                              <td className="font-mono font-semibold">{p.formatted}</td>
                              <td className="font-semibold text-slate-700">House {p.houseNum}</td>
                              <td>
                                {p.isRetro ? (
                                  <span className="text-red-600 font-bold px-1.5 py-0.5 bg-red-50 rounded">R</span>
                                ) : (
                                  <span className="text-emerald-600">Dir</span>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* Current Real-Time Transits (گوچر) */}
                    <div className="bg-white p-4 rounded-xl border border-amber-200">
                      <h3 className="font-bold text-slate-800 text-sm mb-3 border-b pb-2 flex justify-between items-center">
                        <span>موجودہ لائیو گوچر (Current Live Transits)</span>
                        <span className="text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-mono">Live</span>
                      </h3>
                      <table className="w-full text-xs text-left">
                        <thead>
                          <tr className="text-slate-400 border-b pb-1">
                            <th>Planet</th>
                            <th>Current Sign</th>
                            <th>Current Degree</th>
                            <th>Motion</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                          {transits.map(p => (
                            <tr key={'tr-' + p.id} className="hover:bg-slate-50">
                              <td className="py-2 font-bold flex items-center gap-1" style={{ color: p.color }}>
                                <span>{p.symbol}</span>
                                <span>{p.abbrev}</span>
                              </td>
                              <td>{p.signName} ({p.signUr})</td>
                              <td className="font-mono font-semibold">{p.formatted}</td>
                              <td>
                                {p.isRetro ? (
                                  <span className="text-red-600 font-bold px-1.5 py-0.5 bg-red-50 rounded">R</span>
                                ) : (
                                  <span className="text-emerald-600">Dir</span>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: HORARY */}
          {activeTab === "horary" && (
            <div className="mt-6 space-y-6">
              <div className="bg-white p-6 rounded-2xl border border-amber-200 shadow-sm space-y-4">
                <h2 className="text-lg font-bold text-slate-900">سوالیہ زائچہ (Horary Astrology / Prashna)</h2>
                <textarea
                  rows="3"
                  placeholder="اپنا سوال یہاں درج کریں..."
                  value={horaryQuestion}
                  onChange={e => setHoraryQuestion(e.target.value)}
                  className="w-full p-3 text-sm bg-slate-50 border rounded-xl"
                ></textarea>
                <button
                  onClick={() => {
                    if (!horaryQuestion.trim()) return alert("سوال درج کریں");
                    const now = new Date();
                    const res = computeChart(now, lat, lng);
                    setHoraryResult({ question: horaryQuestion, time: now.toLocaleString("en-PK"), chart: res });
                  }}
                  className="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-2 rounded-lg text-sm"
                >
                  استخراج کریں (Cast Horary)
                </button>
              </div>

              {horaryResult && (
                <div className="bg-amber-50 p-6 rounded-2xl border border-amber-300 space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-amber-950">طالع سوال: {horaryResult.chart.ascendant.signName} {horaryResult.chart.ascendant.formatted}</h3>
                    <span className="text-xs text-slate-600">{horaryResult.time}</span>
                  </div>
                  <p className="text-xs text-slate-800 leading-relaxed urdu-font bg-white p-4 rounded-xl border">
                    سوال کے وقت طالع اور قمر کے نظرات کی بنیاد پر معاملہ قابلِ غور ہے۔ ذاتی تفصیلی حل اور وظائف کے لیے نیچے دیے گئے واٹس ایپ پر فیس منتقل کر کے رابطہ کریں۔
                  </p>
                  
                  {/* Payment Card */}
                  <div className="bg-white p-4 rounded-xl border-2 border-amber-400 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                      <div className="text-xs text-slate-500 font-semibold">Raast ID / EasyPaisa (فیس: 2,000 روپے فی سوال)</div>
                      <div className="text-base font-mono font-bold text-slate-900">0300-1234567</div>
                    </div>
                    <button
                      onClick={() => window.open(`https://api.whatsapp.com/send?phone=923001234567&text=${encodeURIComponent("السلام علیکم! میں نے Astro Clarity ایپ سے سوال پوچھا ہے اور 2,000 روپے منتقل کر دیے ہیں۔ سوال: " + horaryQuestion)}`, '_blank')}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow"
                    >
                      💬 واٹس ایپ پر رسید بھیجیں
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* 4. TRUE ASTROLOGICAL CIRCULAR WHEEL (Ascendant strictly locked at 9 o'clock) */
    function TrueAstroWheel({ natal, transits, ascendant, mc, cusps, view }) {
      const size = 520;
      const center = size / 2;
      const rOuter = 240;
      const rSigns = 205;
      const rTransits = 160;
      const rNatal = 110;
      const rInner = 60;

      const ascLon = ascendant ? ascendant.longitude : 0;

      // Mathematical conversion: Ascendant degree is strictly at Left (180° / 9 o'clock)
      // Degrees increase counter-clockwise
      const getCoords = (lon, radius) => {
        const deltaDeg = (lon - ascLon + 360) % 360;
        const screenAngleRad = (180 - deltaDeg) * (Math.PI / 180);
        return {
          x: center + radius * Math.cos(screenAngleRad),
          y: center - radius * Math.sin(screenAngleRad)
        };
      };

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="max-w-full h-auto">
          {/* Concentric rings */}
          <circle cx={center} cy={center} r={rOuter} fill="#fdfbf7" stroke="#cbd5e1" strokeWidth="2" />
          <circle cx={center} cy={center} r={rSigns} fill="#ffffff" stroke="#e2e8f0" strokeWidth="1.5" />
          <circle cx={center} cy={center} r={rTransits} fill="#f8fafc" stroke="#cbd5e1" strokeWidth="1.5" />
          <circle cx={center} cy={center} r={rNatal} fill="#ffffff" stroke="#e2e8f0" strokeWidth="1" />
          <circle cx={center} cy={center} r={rInner} fill="#fdfbf7" stroke="#cbd5e1" strokeWidth="1" />

          {/* 12 Zodiac Signs on Outer Ring */}
          {Array.from({ length: 12 }).map((_, sIdx) => {
            const signStartLon = sIdx * 30;
            const signMidLon = signStartLon + 15;
            const p1 = getCoords(signStartLon, rOuter);
            const p2 = getCoords(signStartLon, rSigns);
            const mid = getCoords(signMidLon, (rOuter + rSigns) / 2);
            const s = ZODIAC_SIGNS[sIdx];

            return (
              <g key={sIdx}>
                <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#cbd5e1" strokeWidth="1" />
                <text
                  x={mid.x}
                  y={mid.y}
                  textAnchor="middle"
                  dominantBaseline="central"
                  fontSize="12"
                  fontWeight="bold"
                  fill={s.color}
                >
                  {s.symbol}
                </text>
              </g>
            );
          })}

          {/* 12 Placidus House Cusps */}
          {cusps && Array.from({ length: 12 }).map((_, i) => {
            const h = i + 1;
            const cuspLon = cusps[h];
            const pStart = getCoords(cuspLon, rSigns);
            const pEnd = getCoords(cuspLon, rInner);
            const isAxis = h === 1 || h === 7 || h === 10 || h === 4;

            return (
              <line
                key={`h-${h}`}
                x1={pStart.x}
                y1={pStart.y}
                x2={pEnd.x}
                y2={pEnd.y}
                stroke={isAxis ? "#d97706" : "#cbd5e1"}
                strokeWidth={isAxis ? "2" : "1"}
                strokeDasharray={isAxis ? "none" : "3 2"}
              />
            );
          })}

          {/* Primary Horizon Axis: Ascendant (Left) to Descendant (Right) */}
          <line
            x1={center - rOuter}
            y1={center}
            x2={center + rOuter}
            y2={center}
            stroke="#d97706"
            strokeWidth="2.5"
          />
          <polygon
            points={`${center - rOuter},${center} ${center - rOuter + 14},${center - 5} ${center - rOuter + 14},${center + 5}`}
            fill="#d97706"
          />
          <text x={center - rOuter + 20} y={center - 8} fill="#d97706" fontSize="11" fontWeight="bold">
            AC {ascendant?.formatted}
          </text>
          <text x={center + rOuter - 45} y={center - 8} fill="#d97706" fontSize="10" fontWeight="bold">
            DC 7th
          </text>

          {/* MC Marker */}
          {mc && (() => {
            const mcPt = getCoords(mc.longitude, rOuter);
            return (
              <g>
                <text x={mcPt.x} y={mcPt.y - 6} textAnchor="middle" fill="#d97706" fontSize="10" fontWeight="bold">
                  MC {mc.formatted}
                </text>
              </g>
            );
          })()}

          {/* Outer Ring: Current Transits (گوچر) */}
          {transits && transits.map(p => {
            const pt = getCoords(p.longitude, (rSigns + rTransits) / 2);
            return (
              <g key={`tr-${p.id}`} transform={`translate(${pt.x}, ${pt.y})`}>
                <circle cx="0" cy="0" r="9" fill="#ffffff" stroke={p.color} strokeWidth="1.5" />
                <text x="0" y="1" textAnchor="middle" dominantBaseline="central" fontSize="8" fontWeight="bold" fill={p.color}>
                  {p.abbrev}
                </text>
                {p.isRetro && <text x="6" y="-4" fontSize="7" fontWeight="bold" fill="#dc2626">R</text>}
              </g>
            );
          })}

          {/* Inner Ring: Natal Planets (پیدائشی سیارے) */}
          {natal && natal.map(p => {
            const lon = view === "D9" ? (p.d9SignIndex * 30 + p.d9Deg) : p.longitude;
            const pt = getCoords(lon, (rTransits + rNatal) / 2);
            return (
              <g key={`nat-${p.id}`} transform={`translate(${pt.x}, ${pt.y})`}>
                <circle cx="0" cy="0" r="11" fill={p.color} />
                <text x="0" y="1" textAnchor="middle" dominantBaseline="central" fontSize="8.5" fontWeight="bold" fill="#ffffff">
                  {p.abbrev}
                </text>
                <text x="0" y="16" textAnchor="middle" fontSize="7.5" fontWeight="bold" fill="#0f172a">
                  {view === "D9" ? `${p.d9Deg}°` : p.formatted}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
