    /* SWISS EPHEMERIS ACCURATE GEOCENTRIC ENGINE                                 */

    function computeAccurateChart(utcDate, lat, lng) {
      const time = Astronomy.MakeTime(utcDate);
      const T = time.ut / 36525.0;

      // 1. Sidereal Time, RAMC & Angles
      const gastHours = Astronomy.SiderealTime(time);
      const gastDeg = (gastHours * 15) % 360;
      const ramc = ((gastDeg + lng) % 360 + 360) % 360;
      const ramcRad = ramc * Math.PI / 180;

      const epsDeg = 23.4392911 - 0.0130042 * T;
      const epsRad = epsDeg * Math.PI / 180;
      const latRad = lat * Math.PI / 180;

      // Midheaven (MC)
      let mcLon = Math.atan2(Math.sin(ramcRad), Math.cos(ramcRad) * Math.cos(epsRad)) * (180 / Math.PI);
      mcLon = ((mcLon % 360) + 360) % 360;

      // Ascendant (ASC) - Geocentric Apparent Horizon Intersection
      const ascY = Math.cos(ramcRad);
      const ascX = -(Math.sin(epsRad) * Math.tan(latRad) + Math.cos(epsRad) * Math.sin(ramcRad));
      let ascLon = Math.atan2(ascY, ascX) * (180 / Math.PI);
      ascLon = ((ascLon % 360) + 360) % 360;

      // Placidus House Cusps
      const houseCusps = computePlacidus(ramc, ascLon, mcLon, lat, epsDeg);

      // 2. Geocentric Apparent Positions (Light-time & Aberration Corrected)
      const planets = [];
      const nextTime = Astronomy.MakeTime(new Date(utcDate.getTime() + 6 * 3600000));

      PLANET_METADATA.forEach(meta => {
        let lon = 0;
        let isRetro = false;

        if (meta.id === "Rahu" || meta.id === "Ketu") {
          const omega = ((125.04452 - 1934.136261 * T) % 360 + 360) % 360;
          lon = meta.id === "Rahu" ? omega : (omega + 180) % 360;
          isRetro = true;
        } else {
          const gVec = Astronomy.GeoVector(meta.id, time, Astronomy.Aberration.Corrected);
          const ecl = Astronomy.Ecliptic(gVec);
          lon = (ecl.elon % 360 + 360) % 360;

          const nextGVec = Astronomy.GeoVector(meta.id, nextTime, Astronomy.Aberration.Corrected);
          const nextEcl = Astronomy.Ecliptic(nextGVec);
          let diff = nextEcl.elon - ecl.elon;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          if (diff < 0) isRetro = true;
        }

        const signIndex = Math.floor(lon / 30) % 12;
        const degInSign = lon % 30;
        const deg = Math.floor(degInSign);
        const min = Math.floor((degInSign - deg) * 60);

        // Parasara / AstroSage Exact D9 Navamsha Pada
        const pada = Math.floor(degInSign / 3.33333333);
        let startSign = 0;
        if (signIndex % 4 === 0) startSign = 0;      // Fire -> Aries

        else if (signIndex % 4 === 2) startSign = 6; // Air -> Libra
        else if (signIndex % 4 === 3) startSign = 3; // Water -> Cancer
        const d9SignIndex = (startSign + pada) % 12;
        const d9Deg = Math.floor(((degInSign % 3.33333333) / 3.33333333) * 30);

        const houseNum = getHouseNumber(lon, houseCusps);

        planets.push({
          ...meta,
          longitude: lon,
          signIndex,
          signName: ZODIAC_SIGNS[signIndex].name,
          signUr: ZODIAC_SIGNS[signIndex].ur,
          signSymbol: ZODIAC_SIGNS[signIndex].symbol,
          deg,
          min,
          formatted: `${deg}°${min < 10 ? '0' + min : min}'`,
          isRetro,

          d9SignName: ZODIAC_SIGNS[d9SignIndex].name,
          d9SignUr: ZODIAC_SIGNS[d9SignIndex].ur,
          d9Deg,
          houseNum
        });
      });

      const ascSignIdx = Math.floor(ascLon / 30) % 12;
      const ascDegInSign = ascLon % 30;
      const ascDeg = Math.floor(ascDegInSign);
      const ascMin = Math.floor((ascDegInSign - ascDeg) * 60);

      // D9 Ascendant
      const ascPada = Math.floor(ascDegInSign / 3.33333333);
      let ascStartSign = 0;
      if (ascSignIdx % 4 === 0) ascStartSign = 0;
      else if (ascSignIdx % 4 === 1) ascStartSign = 9;
      else if (ascSignIdx % 4 === 2) ascStartSign = 6;
      else if (ascSignIdx % 4 === 3) ascStartSign = 3;
      const d9AscSignIdx = (ascStartSign + ascPada) % 12;

      const mcSignIdx = Math.floor(mcLon / 30) % 12;
      const mcDegInSign = mcLon % 30;

      return {
        ascendant: {
          longitude: ascLon,
          signIndex: ascSignIdx,
          signName: ZODIAC_SIGNS[ascSignIdx].name,
          signUr: ZODIAC_SIGNS[ascSignIdx].ur,

          longitude: mcLon,
          signIndex: mcSignIdx,
          signName: ZODIAC_SIGNS[mcSignIdx].name,
          formatted: `${Math.floor(mcDegInSign)}°${Math.floor((mcDegInSign % 1) * 60)}'`
        },
        houseCusps,
        planets
      };
    }

    function computePlacidus(ramc, asc, mc, lat, eps) {
      const cusps = new Array(13).fill(0);
      cusps[1] = asc;
      cusps[10] = mc;
      cusps[7] = (asc + 180) % 360;
      cusps[4] = (mc + 180) % 360;

      const calcCusp = (rOffset, factor, isAbove) => {
        const phi = lat * Math.PI / 180;
        const e = eps * Math.PI / 180;
        let ra = (ramc + rOffset) * Math.PI / 180;
        for (let i = 0; i < 8; i++) {
          const sinD = Math.sin(e) * Math.sin(ra);
          const tanD = sinD / Math.sqrt(Math.max(0.0001, 1 - sinD * sinD));
          const ad = Math.asin(Math.max(-0.999, Math.min(0.999, Math.tan(phi) * tanD)));
          const target = (ramc * Math.PI / 180) + (isAbove ? 1 : -1) * (factor * (Math.PI / 2 + ad));
          ra = (ra + target) / 2;
        }
        let l = Math.atan2(Math.sin(ra) / Math.cos(e), Math.cos(ra)) * (180 / Math.PI);
        return ((l % 360) + 360) % 360;
      };

      cusps[11] = calcCusp(30, 1/3, true);
      cusps[12] = calcCusp(60, 2/3, true);
      cusps[2] = calcCusp(120, 2/3, false);
      cusps[3] = calcCusp(150, 1/3, false);

      cusps[5] = (cusps[11] + 180) % 360;
      cusps[6] = (cusps[12] + 180) % 360;
      cusps[8] = (cusps[2] + 180) % 360;
      cusps[9] = (cusps[3] + 180) % 360;

      return cusps;
    }

    function getHouseNumber(lon, cusps) {
      for (let h = 1; h <= 12; h++) {
        const nextH = h === 12 ? 1 : h + 1;
        let start = cusps[h];
        let end = cusps[nextH];
        if (start < end) {
          if (lon >= start && lon < end) return h;
        } else {
          if (lon >= start || lon < end) return h;
        }
      }
      return 1;
    }

                      {/* Direct WhatsApp Action Button */}
                      <button
                        onClick={() => {
                          const msg = `السلام علیکم! میرا نام Astro Clarity کلائنٹ ہے۔\n\nسوال کا موضوع: ${horaryResult.topic}\nسوال: ${horaryQuestion}\n\nمیں نے آپ کے JazzCash / Raast نمبر (+923005442230) پر 2,000 روپے فیس منتقل کر دی ہے، برائے مہربانی رسید تصدیق فرما کر تفصیلی رہنمائی عنایت فرمائیں۔`;
                          window.open(`https://api.whatsapp.com/send?phone=${ASTRO_PROFILE.whatsappNumber}&text=${encodeURIComponent(msg)}`, '_blank');
                        }}
                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-md transition text-sm"
                      >
                        <span>💬</span> سیدھا واٹس ایپ پر رسید اور سوال بھیجیں (+923005442230)
                      </button>
                    </div>
                  </div>

                  {/* 2. ADMIN ONLY TECHNICAL BREAKDOWN (Secret View) */}
                  {isAdmin && (
                    <div className="bg-slate-900 text-slate-100 p-6 rounded-2xl border-2 border-emerald-500 space-y-4 shadow-lg">
                      <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                        <div className="flex items-center gap-2">
                          <span className="bg-emerald-500 text-slate-950 text-[10px] font-bold px-2 py-0.5 rounded">ADMIN ONLY</span>
                          <h4 className="font-bold text-sm text-emerald-400">تکنیکی نجومی تجزیہ (Astrologer Deep Analysis)</h4>
                        </div>
                        <span className="text-xs font-mono text-slate-400">Asc: {horaryResult.chart.ascendant.signName} {horaryResult.chart.ascendant.formatted}</span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div className="p-3 bg-slate-800 rounded-xl border border-slate-700">
                          <div className="text-slate-400 mb-1 font-semibold">متعلقہ گھر و حاکم (Significator Houses):</div>
                          {horaryResult.relevantHouses.map(h => (
                            <div key={h.houseNum} className="flex justify-between py-0.5">
                              <span>House {h.houseNum} ({h.sign.name}):</span>
                              <span className="font-bold text-amber-400">Lord: {h.lord}</span>
                            </div>
                          ))}
                        </div>

                        <div className="p-3 bg-slate-800 rounded-xl border border-slate-700">
                          <div className="text-slate-400 mb-1 font-semibold">موضوع کے کارکا سیارے (Karakas):</div>
                          <div className="font-bold text-emerald-400">{horaryResult.karakas.join(", ")}</div>
                          <div className="mt-2 text-slate-400 font-semibold">قمر کی پوزیشن (Moon Flow):</div>
                          <div className="font-bold text-blue-300">{horaryResult.moonPlacement}</div>
                        </div>

                        <div className="p-3 bg-slate-800 rounded-xl border border-slate-700">
                          <div className="text-slate-400 mb-1 font-semibold">طالع سوال کا نوانش (D9):</div>
                          <div className="font-bold text-amber-400">{horaryResult.chart.ascendant.d9SignName}</div>
                          <div className="mt-2 text-slate-400 font-semibold">وسط السماء (MC):</div>
                          <div className="font-bold text-slate-200">{horaryResult.chart.midheaven.signName} {horaryResult.chart.midheaven.formatted}</div>
                        </div>
                      </div>

                      <p className="text-[11px] text-slate-400 italic">
                        * نوٹ: یہ پینل عام صارفین سے مخفی ہے۔ آپ سوال کا جواب دینے سے پہلے ان متعلقہ گھروں اور سیاروں کی پوزیشنز دیکھ کر کلائنٹ کو واٹس ایپ پر مستند ترین حل پیش کر سکتے ہیں۔
                      </p>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ========================================================================== */
    /* ASTRO.COM STYLE WHEEL WITH 4-ELEMENT COLORED ARCS & INTERNAL ASPECT LINES  */
    /* ========================================================================== */
    function AstroComStyleWheel({ natal, transits, ascendant, mc, cusps, view }) {
      const size = 540;
      const center = size / 2;
      const rOuter = 250;
      const rSigns = 215;
      const rTransits = 175;
      const rNatal = 120;
      const rInner = 65;

      const ascLon = ascendant ? ascendant.longitude : 0;

      // Mathematical Angle: Ascendant is locked on the LEFT (180° / 9 o'clock)
      // Degrees increase counter-clockwise downwards into Houses 1, 2, 3...
      const getCoords = (lon, radius) => {
        const deltaDeg = (lon - ascLon + 360) % 360;
        const rad = deltaDeg * (Math.PI / 180);
        return {
          x: center - radius * Math.cos(rad),
          y: center + radius * Math.sin(rad)
        };
      };

      const describeArc = (startDeg, endDeg, rIn, rOut) => {
        const p1 = getCoords(startDeg, rOut);
        const p2 = getCoords(endDeg, rOut);
        const p3 = getCoords(endDeg, rIn);
        const p4 = getCoords(startDeg, rIn);
        return `M ${p1.x} ${p1.y} A ${rOut} ${rOut} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rIn} ${rIn} 0 0 0 ${p4.x} ${p4.y} Z`;
      };

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="max-w-full h-auto">
          {/* Base Rings */}
          <circle cx={center} cy={center} r={rOuter} fill="#ffffff" stroke="#cbd5e1" strokeWidth="2" />
          <circle cx={center} cy={center} r={rTransits} fill="#fafafa" stroke="#e2e8f0" strokeWidth="1.5" />
          <circle cx={center} cy={center} r={rNatal} fill="#ffffff" stroke="#cbd5e1" strokeWidth="1.5" />
          <circle cx={center} cy={center} r={rInner} fill="#fdfbf7" stroke="#e2e8f0" strokeWidth="1" />

          {/* 12 Zodiac Signs with Astro.com 4-Element Colored Bands */}
          {Array.from({ length: 12 }).map((_, sIdx) => {
            const startLon = sIdx * 30;
            const endLon = startLon + 30;
            const midLon = startLon + 15;
            const midPt = getCoords(midLon, (rOuter + rSigns) / 2);
            const sign = ZODIAC_SIGNS[sIdx];

            return (
              <g key={`sign-${sIdx}`}>
                <path d={describeArc(startLon, endLon, rSigns, rOuter)} fill={sign.bg} stroke={sign.border} strokeWidth="1" />
                <text
                  x={midPt.x}
                  y={midPt.y}
                  textAnchor="middle"
                  dominantBaseline="central"
                  fontSize="13"
                  fontWeight="bold"
                  fill={sign.text}
                >
                  {sign.symbol}
                </text>
              </g>
            );
          })}

          {/* Aspect Lines inside Center */}
          {natal && natal.map((p1, idx) => {
            return natal.slice(idx + 1).map(p2 => {
              let diff = Math.abs(p1.longitude - p2.longitude);
              if (diff > 180) diff = 360 - diff;

              let strokeColor = null;
              if (Math.abs(diff - 120) < 6) strokeColor = "#2563eb"; // Trine (Blue)
              else if (Math.abs(diff - 90) < 6 || Math.abs(diff - 180) < 6) strokeColor = "#dc2626"; // Square / Opp (Red)
              else if (Math.abs(diff - 60) < 5) strokeColor = "#059669"; // Sextile (Green)

              if (!strokeColor) return null;

              const pt1 = getCoords(p1.longitude, rInner - 2);
              const pt2 = getCoords(p2.longitude, rInner - 2);

              return (
                <line
                  key={`asp-${p1.id}-${p2.id}`}
                  x1={pt1.x}
                  y1={pt1.y}
                  x2={pt2.x}
                  y2={pt2.y}
                  stroke={strokeColor}
                  strokeWidth="1"
                  strokeOpacity="0.65"
                />
              );
            });
          })}

          {/* 12 Placidus House Cusps Spokes */}
          {cusps && Array.from({ length: 12 }).map((_, i) => {
            const h = i + 1;
            const cuspLon = cusps[h];
            const pStart = getCoords(cuspLon, rSigns);
            const pEnd = getCoords(cuspLon, rInner);
            const isAxis = h === 1 || h === 7 || h === 10 || h === 4;

            const nextH = h === 12 ? 1 : h + 1;
            let midH = (cuspLon + cusps[nextH]) / 2;
            if (cusps[nextH] < cuspLon) midH = (cuspLon + cusps[nextH] + 360) / 2;
            const numPt = getCoords(midH, rInner + 14);

            return (
              <g key={`cusp-${h}`}>
                <line
                  x1={pStart.x}
                  y1={pStart.y}
                  x2={pEnd.x}
                  y2={pEnd.y}
                  stroke={isAxis ? "#d97706" : "#cbd5e1"}
                  strokeWidth={isAxis ? "2" : "1"}
                  strokeDasharray={isAxis ? "none" : "2 2"}
                />
                <text x={numPt.x} y={numPt.y} textAnchor="middle" dominantBaseline="central" fontSize="8" fontWeight="bold" fill="#64748b">
                  {h}
                </text>
              </g>
            );
          })}

          {/* Horizon Line: Ascendant (Left 9 o'clock) to Descendant (Right 3 o'clock) */}
          <line
            x1={center - rOuter}
            y1={center}
            x2={center + rOuter}
            y2={center}
            stroke="#d97706"
            strokeWidth="2.5"
          />
          <polygon
            points={`${center - rOuter},${center} ${center - rOuter + 14},${center - 5} ${center - rOuter + 14},${center + 5}`}
            fill="#d97706"
          />
          <text x={center - rOuter + 20} y={center - 8} fill="#d97706" fontSize="11" fontWeight="bold">
            AC {ascendant?.formatted}
          </text>
          <text x={center + rOuter - 45} y={center - 8} fill="#d97706" fontSize="10" fontWeight="bold">
            DC 7th
          </text>

          {/* MC Line */}
          {mc && (() => {
            const mcPt = getCoords(mc.longitude, rOuter);
            return (
              <text x={mcPt.x} y={mcPt.y - 6} textAnchor="middle" fill="#d97706" fontSize="10" fontWeight="bold">
                MC {mc.formatted}
              </text>
            );
          })()}

          {/* Outer Ring: Current Real-Time Transits (Live گوچر) */}
          {transits && transits.map(p => {
            const pt = getCoords(p.longitude, (rSigns + rTransits) / 2);
            return (
              <g key={`tr-${p.id}`} transform={`translate(${pt.x}, ${pt.y})`}>
                <circle cx="0" cy="0" r="9.5" fill="#ffffff" stroke={p.color} strokeWidth="1.5" />
                <text x="0" y="1" textAnchor="middle" dominantBaseline="central" fontSize="8.5" fontWeight="bold" fill={p.color}>
                  {p.abbrev}
                </text>
                {p.isRetro && <text x="6" y="-4" fontSize="7.5" fontWeight="bold" fill="#dc2626">R</text>}
              </g>
            );
          })}

          {/* Inner Ring: Natal Planets */}
          {natal && natal.map(p => {
            const lon = view === "D9" ? (p.d9SignIndex * 30 + p.d9Deg) : p.longitude;
            const pt = getCoords(lon, (rTransits + rNatal) / 2);
            return (
              <g key={`nat-${p.id}`} transform={`translate(${pt.x}, ${pt.y})`}>
                <circle cx="0" cy="0" r="11.5" fill={p.color} />
                <text x="0" y="1" textAnchor="middle" dominantBaseline="central" fontSize="9" fontWeight="bold" fill="#ffffff">
                  {p.abbrev}
                </text>
                <text x="0" y="17" textAnchor="middle" fontSize="8" fontWeight="bold" fill="#0f172a">
                  {view === "D9" ? `${p.d9Deg}°` : p.formatted}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
